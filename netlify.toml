[build.environment]
  # These PUBLIC_* / seed flags are config, not secrets. Their values (especially
  # PUBLIC_WP_SOURCE=local) appear all over the repo and trip Netlify's scanner.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_WP_SOURCE,PUBLIC_WP_GRAPHQL_URL_LOCAL,PUBLIC_WP_GRAPHQL_URL_FLYWHEEL,PUBLIC_USE_SEED_DATA,PUBLIC_R2_PUBLIC_URL,USE_SEED_DATA"

# Same-origin proxies for WebGL textures (crossorigin="anonymous").
# Flywheel uploads and the public R2 bucket both omit CORS headers.
[[redirects]]
  from = "/wp-uploads/*"
  to = "https://trichis.flywheelsites.com/wp-content/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/r2/*"
  to = "https://pub-6d1ccefa62e04dcf8d87eb9cf388173b.r2.dev/:splat"
  status = 200
  force = true
